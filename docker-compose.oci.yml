# 단일 VM 배포용 스택 (Oracle Cloud Always Free Ampere A1 기준).
#
# 로컬 개발용 docker-compose.yml을 덮어쓰는 오버레이가 아니라 독립 파일이다. 오버레이로 쓰면
# ports 목록이 병합돼 postgres·mock-pg가 0.0.0.0에 그대로 열리기 때문이다.
#
# 공개되는 포트는 app 하나뿐이다. postgres·mock-pg·관측 스택은 VM의 127.0.0.1에만 바인딩한다.
# 시연 콘솔의 장애 주입 패널은 브라우저가 mock-pg를 직접 부르는데 mock-pg CORS가 localhost만
# 허용하므로(MockPgCorsConfig), 패널을 쓰려면 SSH 터널로 접속한다:
#
#   ssh -L 8080:localhost:8080 -L 8081:localhost:8081 ubuntu@<VM 공인 IP>
#   → http://localhost:8080/console/index.html
#
# 비밀값은 커밋하지 않는 .env에서 읽는다 (.env.oci.example 참고).
#
#   docker compose -f docker-compose.oci.yml --env-file .env up -d --build
#   docker compose -f docker-compose.oci.yml --env-file .env --profile observability up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: groupdrop
      POSTGRES_USER: groupdrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupdrop -d groupdrop"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./app
    image: groupdrop-app:local
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/groupdrop
      SPRING_DATASOURCE_USERNAME: groupdrop
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      GROUPDROP_PG_BASE_URL: http://mock-pg:8081
      GROUPDROP_WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET is required}
      # 시연 스택과 같다 — 캠페인이 CLOSED 되는 즉시 정산 대상 확정에 들어가게 한다.
      GROUPDROP_SETTLEMENT_GRACE_PERIOD: ${SETTLEMENT_GRACE_PERIOD:-0s}
      JAVA_TOOL_OPTIONS: ${APP_JAVA_OPTS:--XX:MaxRAMPercentage=50}
    ports:
      - "${APP_BIND:-0.0.0.0}:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    mem_limit: ${APP_MEM_LIMIT:-2g}

  mock-pg:
    build:
      context: ./mock-pg
    image: groupdrop-mock-pg:local
    restart: unless-stopped
    environment:
      MOCKPG_WEBHOOK_TARGET_URL: http://app:8080/api/webhooks/payments
      MOCKPG_WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      JAVA_TOOL_OPTIONS: ${MOCK_PG_JAVA_OPTS:--XX:MaxRAMPercentage=50}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/actuator/health > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    mem_limit: ${MOCK_PG_MEM_LIMIT:-768m}

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      app:
        condition: service_healthy

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana-data:
