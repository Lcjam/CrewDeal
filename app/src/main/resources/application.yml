server:
  servlet:
    session:
      cookie:
        # JS 클라이언트(/console/**)가 생기면서 CSRF 비활성의 전제가 SameSite=Strict 세션 쿠키로 바뀐다
        # (프론트엔드 계획 §2·5.1). 동일 출처 fetch는 영향이 없고 교차 사이트 폼 위조만 막는다.
        same-site: strict

spring:
  application:
    name: groupdrop
  datasource:
    url: jdbc:postgresql://localhost:5432/groupdrop
    username: groupdrop
    password: groupdrop
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      # Grafana p95 패널이 histogram_quantile을 쓰므로 _bucket 시계열이 필요하다.
      percentiles-histogram:
        inventory.update.duration: true
        payment.pg.confirm.duration: true
        refund.pg.duration: true

groupdrop:
  time-zone: Asia/Seoul
  reservation-duration: 10m
  reconciliation-interval: 30m
  settlement-grace-period: 7d
  inbox-polling-interval: 5s
  outbox-polling-interval: 5s
  campaign-lifecycle-polling-interval: 1s
  reservation-expiry-polling-interval: 5s
  message-lease-duration: 1m
  message-retry-backoff: 5s
  message-batch-size: 50
  idempotency-key-ttl: 24h
  orphan-payment-sweep-interval: 1m
  pg:
    base-url: http://localhost:8081
    request-timeout: 3s
    orphan-threshold-multiplier: 2
  webhook:
    secret: groupdrop-mock-pg-secret
    timestamp-tolerance: 5m
