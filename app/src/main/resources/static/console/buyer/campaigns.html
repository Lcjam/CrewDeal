<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GroupDrop 콘솔 — 공구 목록</title>
  <link rel="stylesheet" href="/console/common/style.css">
</head>
<body>
  <div id="console-nav"></div>
  <main>
    <h1>공구 목록</h1>
    <p>이 화면은 다음 단계에서 구현됩니다.</p>
  </main>

  <script type="module">
    import { requireRole } from '/console/common/session.js';
    import { mountNav } from '/console/common/nav.js';

    async function init() {
      const user = await requireRole('BUYER');
      if (!user) return;
      mountNav(user);
    }

    init();
  </script>
</body>
</html>
