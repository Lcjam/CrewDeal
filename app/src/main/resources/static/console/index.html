<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GroupDrop 콘솔 — 로그인</title>
  <link rel="stylesheet" href="/console/common/style.css">
</head>
<body>
  <main class="login-shell">
    <h1>GroupDrop 시연 콘솔</h1>
    <div class="notice notice--warning">
      이 콘솔은 <strong>로컬 시연 전용</strong>입니다. 시드 계정·비밀번호가 고정되어 있고
      공개 배포 대상이 아닙니다.
    </div>

    <div id="host-banner" class="host-banner"></div>

    <div id="session-panel" hidden></div>

    <section id="login-panel">
      <h2>시드 계정으로 로그인</h2>
      <p>버튼을 누르면 바로 로그인하고 역할별 첫 화면으로 이동합니다. 비밀번호는 5개 계정 모두
        <code>groupdrop123!</code>입니다.</p>
      <div id="seed-buttons" class="seed-buttons"></div>
      <div id="login-error"></div>
    </section>

    <div id="admin-host-warning" class="notice notice--danger" hidden>
      <p><strong>구매자 탭과 세션이 겹칩니다.</strong> 이 브라우저의 <code>localhost</code> 세션은
        구매자·인플루언서·공급사 탭과 공유됩니다. 운영자는 <code>127.0.0.1</code>을 쓰세요
        (프론트엔드 계획 §7.1).</p>
      <div class="seed-buttons">
        <button type="button" class="btn btn-primary" id="admin-host-goto-btn">127.0.0.1로 이동</button>
        <button type="button" class="btn btn-secondary" id="admin-host-proceed-btn">그래도 로그인</button>
        <button type="button" class="btn btn-secondary" id="admin-host-cancel-btn">취소</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { login, logout, currentUserOrNull, homeFor } from '/console/common/session.js';
    import { html } from '/console/common/html.js';
    import { messageFor } from '/console/common/codes.js';
    // 부수효과 import — 로그인 화면의 첫 /api/auth/me·로그인 요청부터 요청 ID 표시줄에 잡히게 한다
    // (session.js도 내부적으로 이를 import하지만, 로그인 화면 자체도 명시적으로 불러온다 — Minor 8).
    import '/console/common/reqlog.js';

    const SEED_PASSWORD = 'groupdrop123!';
    const SEED_ACCOUNTS = [
      { email: 'admin@groupdrop.test', role: 'ADMIN', label: '운영자' },
      { email: 'influencer@groupdrop.test', role: 'INFLUENCER', label: '인플루언서' },
      { email: 'supplier@groupdrop.test', role: 'SUPPLIER', label: '공급사' },
      { email: 'buyer1@groupdrop.test', role: 'BUYER', label: '구매자 1' },
      { email: 'buyer2@groupdrop.test', role: 'BUYER', label: '구매자 2' },
    ];

    const ROLE_LABELS = { BUYER: '구매자', INFLUENCER: '인플루언서', SUPPLIER: '공급사', ADMIN: '운영자' };

    const hostBanner = document.getElementById('host-banner');
    const sessionPanel = document.getElementById('session-panel');
    const loginPanel = document.getElementById('login-panel');
    const seedButtonsEl = document.getElementById('seed-buttons');
    const loginErrorEl = document.getElementById('login-error');
    const adminHostWarning = document.getElementById('admin-host-warning');
    const adminHostGotoBtn = document.getElementById('admin-host-goto-btn');
    const adminHostProceedBtn = document.getElementById('admin-host-proceed-btn');
    const adminHostCancelBtn = document.getElementById('admin-host-cancel-btn');

    hostBanner.textContent = location.hostname;

    function renderSeedButtons() {
      seedButtonsEl.innerHTML = SEED_ACCOUNTS.map((account) => html`
        <button type="button" class="btn btn-secondary" data-email="${account.email}" data-role="${account.role}">
          ${account.label}
          <small>${account.email}</small>
        </button>
      `).join('');

      seedButtonsEl.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => handleSeedLoginClick(btn.dataset.email, btn.dataset.role));
      });
    }

    function buildRedirectTo127Url() {
      const port = location.port ? `:${location.port}` : '';
      return `${location.protocol}//127.0.0.1${port}${location.pathname}${location.search}`;
    }

    /**
     * ADMIN·localhost 조합일 때만 쓰는 경고 게이트. 세 버튼:
     * - "127.0.0.1로 이동": 로그인 없이 같은 포트·경로의 127.0.0.1로 이동한다.
     * - proceedLabel(예: "그래도 로그인"/"그래도 계속"): 명시적 동의 — onProceed를 실행한다.
     * - "취소": 아무 것도 하지 않고 originPanel(로그인/세션)로 되돌아간다.
     * loginPanel·sessionPanel을 모두 숨긴 뒤 보여준다 — 어느 경로로 왔든 일관되게 동작한다 (M4).
     */
    function showAdminHostWarning(proceedLabel, originPanel, onProceed) {
      loginPanel.hidden = true;
      sessionPanel.hidden = true;
      adminHostWarning.hidden = false;
      adminHostProceedBtn.textContent = proceedLabel;

      adminHostGotoBtn.onclick = () => {
        location.href = buildRedirectTo127Url();
      };
      adminHostCancelBtn.onclick = () => {
        adminHostWarning.hidden = true;
        if (originPanel === 'session') {
          sessionPanel.hidden = false;
        } else {
          loginPanel.hidden = false;
        }
      };
      adminHostProceedBtn.onclick = async () => {
        adminHostWarning.hidden = true;
        await onProceed();
      };
    }

    /**
     * 시드 버튼 클릭. ADMIN + localhost면 login()을 호출하기 **전에** 경고를 보여주고 명시적
     * 동의를 받는다 — login()을 먼저 부르면 공유 localhost 세션이 이미 교체된 뒤라 늦다 (M4).
     */
    function handleSeedLoginClick(email, role) {
      loginErrorEl.innerHTML = '';
      if (role === 'ADMIN' && location.hostname === 'localhost') {
        showAdminHostWarning('그래도 로그인', 'login', () => performLogin(email));
        return;
      }
      performLogin(email);
    }

    async function performLogin(email) {
      try {
        const user = await login(email, SEED_PASSWORD);
        location.href = homeFor(user.role);
      } catch (err) {
        loginPanel.hidden = false;
        loginErrorEl.innerHTML = html`<div class="notice notice--danger">${messageFor(err)}</div>`;
      }
    }

    function renderSessionPanel(user) {
      loginPanel.hidden = true;
      sessionPanel.hidden = false;
      sessionPanel.innerHTML = html`
        <div class="card">
          <p>이미 로그인되어 있습니다.</p>
          <p><strong>${ROLE_LABELS[user.role] ?? user.role}</strong> · ${user.displayName} (${user.email})</p>
          <div class="seed-buttons">
            <button type="button" class="btn btn-primary" id="continue-btn">계속하기</button>
            <button type="button" class="btn btn-secondary" id="switch-account-btn">로그아웃</button>
          </div>
        </div>
      `;
      sessionPanel.querySelector('#continue-btn').addEventListener('click', () => {
        // 이미 로그인된 "계속하기" 경로에는 login() 호출이 없다 — 이동 여부만 확인하면 된다.
        // 그래도 ADMIN + localhost 조합이면 같은 경고를 보여준다 (세션 패널도 숨긴다, M4).
        if (user.role === 'ADMIN' && location.hostname === 'localhost') {
          showAdminHostWarning('그래도 계속', 'session', () => {
            location.href = homeFor(user.role);
          });
          return;
        }
        location.href = homeFor(user.role);
      });
      sessionPanel.querySelector('#switch-account-btn').addEventListener('click', async () => {
        try {
          await logout();
        } finally {
          // 로그아웃 API가 실패해도(네트워크 오류 등) 로그인 패널은 보여준다 — 멱등 키는
          // session.js#logout()의 자체 try/finally가 이미 정리한다 (Minor 10).
          sessionPanel.hidden = true;
          loginPanel.hidden = false;
        }
      });
    }

    async function init() {
      renderSeedButtons();
      const user = await currentUserOrNull();
      if (user) {
        renderSessionPanel(user);
      }
    }

    init();
  </script>
</body>
</html>
