<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GroupDrop 콘솔 — 참여 캠페인</title>
  <link rel="stylesheet" href="/console/common/style.css">
  <style>
    /* 이 페이지에서만 쓰는 최소 스타일 — buyer/campaigns.html과 겹치는 부분은 공통화 후보. */
    .camp-period { font-size: 12px; color: var(--color-text-muted); white-space: nowrap; }
    .camp-sku-list { display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
    .camp-sku-list__row { display: flex; justify-content: space-between; gap: var(--spacing-2); }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .toolbar { display: flex; justify-content: flex-end; margin-bottom: var(--spacing-2); }
  </style>
</head>
<body>
  <div id="console-nav"></div>
  <main>
    <h1>참여 캠페인</h1>
    <p class="hint">내 상품이 쓰인 캠페인과 옵션별 잔여 재고, 예상 공급대금을 5초마다 확인합니다.</p>
    <p class="hint">
      예상 공급대금은 원장 <code>SUPPLIER_PAYABLE</code> 계정 잔액입니다 (LED-01). 환불이 생기면 원장에
      역분개가 먼저 반영되므로, 이 값은 환불된 만큼 곧바로 줄어듭니다.
    </p>
    <div class="toolbar"><button type="button" class="btn btn-secondary" id="refresh-btn">새로고침</button></div>
    <div id="notice" role="status" aria-live="polite"></div>
    <table>
      <thead>
        <tr>
          <th>이름</th><th>상품</th><th>상태</th><th>판매 기간</th><th>딜가</th><th>SKU별 잔여 재고</th><th>예상 공급대금</th>
        </tr>
      </thead>
      <tbody id="campaigns-tbody">
        <tr><td colspan="7">불러오는 중…</td></tr>
      </tbody>
    </table>
  </main>
  <script type="module">
    import { bootSupplier } from '/console/supplier/supplier.js';
    import { initCampaignsPage } from '/console/supplier/campaigns.js';
    const user = await bootSupplier();
    if (user) { initCampaignsPage(); }
  </script>
</body>
</html>
