services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: groupdrop
      POSTGRES_USER: groupdrop
      POSTGRES_PASSWORD: groupdrop
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupdrop -d groupdrop"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./app
    image: groupdrop-app:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/groupdrop
      SPRING_DATASOURCE_USERNAME: groupdrop
      SPRING_DATASOURCE_PASSWORD: groupdrop
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  mock-pg:
    build:
      context: ./mock-pg
    image: groupdrop-mock-pg:local
    ports:
      - "${MOCK_PG_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/actuator/health > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 6

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
  grafana-data:
